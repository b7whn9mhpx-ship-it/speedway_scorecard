<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Speedway Match Scorecard</title>

  <!-- PWA & iOS Safari Meta Tags -->
  <meta name="description" content="Progressive Web App for scoring British speedway matches on iPhone.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Speedway">
  <meta name="theme-color" content="#121826">
  <meta name="format-detection" content="telephone=no">

  <!-- Icons and Manifest -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">

  <!-- Tailwind CSS CDN for utility styling & base reset -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            speedway: {
              amber: '#f59e0b',
              red: '#ef4444',
              blue: '#3b82f6',
              white: '#f8fafc',
              yellow: '#eab308',
              green: '#22c55e',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Mobile-First CSS -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-[#090d16] text-slate-100 selection:bg-amber-500 selection:text-black">

  <div id="app-container">
    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Sticky Scoreboard Header -->
    <header class="app-header">
      <div class="scoreboard-bar">
        <!-- Home Team -->
        <div class="team-box home">
          <div class="team-tag">
            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
            <span>Home</span>
          </div>
          <div class="team-name" id="header-home-name">Belle Vue Aces</div>
        </div>

        <!-- Live Score Counter -->
        <div class="score-display">
          <span class="score-num home" id="header-home-score">0</span>
          <span class="score-divider">:</span>
          <span class="score-num away" id="header-away-score">0</span>
        </div>

        <!-- Away Team -->
        <div class="team-box away">
          <div class="team-tag">
            <span>Away</span>
            <span class="w-2 h-2 rounded-full bg-yellow-500"></span>
          </div>
          <div class="team-name" id="header-away-name">Sheffield Tigers</div>
        </div>
      </div>

      <div class="match-subtext">
        <span id="header-match-league" class="truncate max-w-[220px]">SGB Premiership</span>
        <span id="header-heat-badge" class="heat-badge">Heat 1 / 15</span>
      </div>
    </header>

    <!-- Main View Scroller Container -->
    <main class="view-container" id="main-scroller">
      <!-- Tab 1: Live Heat Scoring View -->
      <section id="view-heats" class="view-page active"></section>

      <!-- Tab 2: Program Matrix Scorecard View -->
      <section id="view-scorecard" class="view-page"></section>

      <!-- Tab 3: Rider Performance & Stats View -->
      <section id="view-riders" class="view-page"></section>

      <!-- Tab 4: Match Analytics & Gate Bias View -->
      <section id="view-stats" class="view-page"></section>

      <!-- Tab 5: Match Setup, Rosters & History View -->
      <section id="view-setup" class="view-page"></section>
    </main>

    <!-- iOS Native Bottom Tab Bar -->
    <nav class="tab-bar">
      <!-- Tab: Heats -->
      <button class="tab-item active" data-tab="heats" aria-label="Heats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>
        </svg>
        <span>Heats</span>
      </button>

      <!-- Tab: Scorecard Grid -->
      <button class="tab-item" data-tab="scorecard" aria-label="Scorecard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
        </svg>
        <span>Scorecard</span>
      </button>

      <!-- Tab: Riders -->
      <button class="tab-item" data-tab="riders" aria-label="Riders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Riders</span>
      </button>

      <!-- Tab: Stats -->
      <button class="tab-item" data-tab="stats" aria-label="Stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>Stats</span>
      </button>

      <!-- Tab: Match Setup -->
      <button class="tab-item" data-tab="setup" aria-label="Match">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Match</span>
      </button>
    </nav>
  </div>

  <!-- Main ES Module Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
